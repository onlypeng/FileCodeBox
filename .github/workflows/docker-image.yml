name: Build and publish Docker image

# 镜像内容来自本仓库：Python 源码 + 已提交的 frontend_dist（Dockerfile 直接 COPY）。
# 前端源码在另一个仓库，按项目约定「构建产物入库」，CI 里不再重复 npm build；
# 下面第一步会校验产物完整性，避免把陈旧/残缺的界面打进镜像。
#
# 发布目标：
#   - GHCR（ghcr.io/<owner>/<repo>）：使用 GITHUB_TOKEN，零额外配置，默认始终推送。
#   - Docker Hub：仅当仓库配置了 DOCKER_USERNAME + DOCKER_PASSWORD 两个 Secrets 时推送，
#     目标为 <DOCKER_USERNAME>/filecodebox（与 readme / docs 的 lanol/filecodebox 一致）。
#     未配置时跳过，不会产生类似 "/filecodebox" 的非法镜像名。

on:
  push:
    branches: [master, main, dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push_image:
        description: '推送镜像（关闭则只构建验证，不发布）'
        type: boolean
        default: true
      platforms:
        description: '目标架构'
        type: choice
        default: 'linux/amd64,linux/arm64'
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'

permissions:
  contents: read
  packages: write

# 同一分支连续推送只保留最新一次构建，避免多架构构建互相抢缓存、覆盖同一 tag
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify committed frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend_dist/index.html || {
            echo "::error::frontend_dist/index.html 缺失，请先构建并同步前端产物"; exit 1; }
          test -f requirements.txt || {
            echo "::error::requirements.txt 缺失，Dockerfile 无法安装依赖"; exit 1; }
          count=$(find frontend_dist/assets -maxdepth 1 -type f | wc -l)
          test "$count" -gt 0 || {
            echo "::error::frontend_dist/assets 为空，镜像会打出空白界面"; exit 1; }
          missing=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            if [ ! -f "frontend_dist/$ref" ]; then
              echo "::error::index.html 引用了不存在的产物：$ref"
              missing=1
            fi
          done < <(grep -oE '(src|href)="/assets/[^"]+"' frontend_dist/index.html \
                    | grep -oE 'assets/[^"]+' | sort -u)
          test "$missing" -eq 0 || {
            echo "::error::前端产物不完整，拒绝构建"; exit 1; }
          echo "前端产物校验通过：$count 个 assets 文件，入口引用齐全"

      - name: Resolve image names
        id: images
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          # GHCR 镜像名必须全小写；github.repository 可能含大写（FileCodeBox）
          repo_lc=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          dockerhub=false
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            dockerhub=true
            echo "::notice::Docker Hub 凭据已配置，将同时推送 ${DOCKER_USERNAME}/filecodebox"
          else
            echo "::notice::未配置 DOCKER_USERNAME/DOCKER_PASSWORD，仅推送 GHCR（零配置）"
          fi
          {
            echo 'list<<IMAGE_LIST_EOF'
            echo "ghcr.io/${repo_lc}"
            if [ "$dockerhub" = true ]; then
              echo "${DOCKER_USERNAME}/filecodebox"
            fi
            echo 'IMAGE_LIST_EOF'
            echo "dockerhub=${dockerhub}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.images.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest
        shell: bash
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Published tags:"
          echo "${{ steps.meta.outputs.tags }}"
